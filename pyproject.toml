[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-hygiene"
version = "0.1.0"
description = "Local, explainable checks for sensitive text before sharing with AI tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prompt-hygiene = "prompt_hygiene.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
